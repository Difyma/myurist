                const tens = ['', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто'];
                const hundreds = ['', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот', 'шестьсот', 'семьсот', 'восемьсот', 'девятьсот'];
                
                if (number < 10) return units[number];
                if (number < 20) return teens[number - 10];
                if (number < 100) return tens[Math.floor(number / 10)] + (number % 10 ? ' ' + units[number % 10] : '');
                if (number < 1000) return hundreds[Math.floor(number / 100)] + (number % 100 ? ' ' + this.numberToWords(number % 100) : '');
                if (number < 1000000) {
                    const thousands = Math.floor(number / 1000);
                    const remainder = number % 1000;
                    let thousandsWord = this.numberToWords(thousands);
                    if (thousands === 1) thousandsWord = 'одна тысяча';
                    else if (thousands === 2) thousandsWord = 'две тысячи';
                    else if (thousands < 5) thousandsWord += ' тысячи';
                    else thousandsWord += ' тысяч';
                    return thousandsWord + (remainder ? ' ' + this.numberToWords(remainder) : '');
                }
                return number.toLocaleString('ru-RU');

        // Risks Calculator
        const risks = {
            init() {

            calculate() {
                const amount = parseFloat(document.getElementById('contract-amount')?.value) || 0;
                const penaltyRate = parseFloat(document.getElementById('penalty-percent')?.value) || 0;
                const days = parseInt(document.getElementById('delay-days')?.value) || 0;
                const fine = parseFloat(document.getElementById('fine-amount')?.value) || 0;
                const unilateral = document.getElementById('unilateral-refusal')?.checked || false;

                const penaltySum = amount * (penaltyRate / 100) * days;
                const damages = unilateral ? amount * 0.5 : 0;
                const total = Math.min(penaltySum + fine + damages, amount * 3);

                const riskResult = document.getElementById('risk-result');
                if (riskResult) riskResult.classList.remove('hidden');
                
                const maxLiability = document.getElementById('max-liability');
                const penaltySumEl = document.getElementById('penalty-sum');
                const finesSumEl = document.getElementById('fines-sum');
                const damagesSumEl = document.getElementById('damages-sum');
                
                if (maxLiability) maxLiability.textContent = new Intl.NumberFormat('ru-RU').format(total) + ' ₽';
                if (penaltySumEl) penaltySumEl.textContent = new Intl.NumberFormat('ru-RU').format(penaltySum) + ' ₽';
                if (finesSumEl) finesSumEl.textContent = new Intl.NumberFormat('ru-RU').format(fine) + ' ₽';
                if (damagesSumEl) damagesSumEl.textContent = new Intl.NumberFormat('ru-RU').format(damages) + ' ₽';

                // Article 333 warning
                const annualRate = penaltyRate * 365;
                const article333Warning = document.getElementById('article-333-warning');
                if (article333Warning) {
                    article333Warning.classList.toggle('hidden', annualRate <= 50);
                }

                // Update recommendations
                const recommendations = document.getElementById('recommendations');
                if (recommendations) {
                    let recs = [];

                        recs.push('• Снизьте неустойку до 0,1-0,3% в день для избежания ст. 333 ГК РФ');

                    if (unilateral) {
                        recs.push('• Добавьте конкретный перечень убытков подлежащих возмещению');

                    if (amount > 0 && penaltySum > amount) {

                    if (recs.length === 0) {

                    }
                    recommendations.innerHTML = recs.map(r => `<li>${r}</li>`).join('');
